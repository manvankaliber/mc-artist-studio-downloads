name: Publish latest desktop downloads

on:
  push:
    branches:
      - "automation/build-*"

permissions:
  contents: write

concurrency:
  group: publish-latest-windows-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release payload
        uses: actions/checkout@v4

      - name: Validate release payload
        run: |
          test -s release/MC-Artist-Studio.exe
          test -s release/MC-Artist-Studio.msi
          test -s release/MC-Artist-Studio.msi.sig
          test -s release/MC-Artist-Studio.AppImage
          test -s release/MC-Artist-Studio.deb
          test -s release/MC-Artist-Studio.AppImage.sig
          test -s release/latest.json
          jq -e '.tag and .title and .notes and .version' release/release.json >/dev/null
          jq -e '.version and .platforms["windows-x86_64"].url and .platforms["windows-x86_64"].signature' release/latest.json >/dev/null
          jq -e '.platforms["linux-x86_64"].url and .platforms["linux-x86_64"].signature' release/latest.json >/dev/null

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(jq -r '.tag' release/release.json)"
          TITLE="$(jq -r '.title' release/release.json)"
          NOTES="$(jq -r '.notes' release/release.json)"
          ASSETS=(release/MC-Artist-Studio.exe release/MC-Artist-Studio.msi release/MC-Artist-Studio.msi.sig release/MC-Artist-Studio.AppImage release/MC-Artist-Studio.AppImage.sig release/MC-Artist-Studio.deb release/latest.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target main --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Redeploy website from the new release
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not configured; the release is available, but the site will not refresh its release details."
          else
            curl --fail --silent --show-error --retry 3 "$VERCEL_DEPLOY_HOOK_URL"
          fi

      - name: Remove temporary payload branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete "$BRANCH_NAME"
